plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-${minecraft_version}-${mod_version}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(java_version as int)
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : mod_version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Built-On-Minecraft'      : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            minecraft_version            : minecraft_version,
            minecraft_version_range      : minecraft_version_range,
            neoforge_version_range       : neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            fabric_loader_version        : fabric_loader_version,
            java_version                 : java_version,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_display_name             : mod_display_name,
            mod_version                  : mod_version,
            mod_authors                  : mod_authors,
            mod_description              : mod_description,
            mod_issues_url               : mod_issues_url,
            mod_page_url                 : mod_page_url,
            mod_git_url                  : mod_git_url,
            mod_license                  : mod_license
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}
